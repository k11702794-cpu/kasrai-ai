<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101828">
<title>استودیوی تصویر | کسری AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  font-family: Tahoma, Arial, sans-serif;
  background: #101828;
  color: #f8fafc;
  line-height: 1.8;
}

.container {
  width: 100%;
  max-width: 900px;
  margin: auto;
}

header {
  text-align: center;
  padding: 18px 8px;
}

header h1 {
  margin: 0 0 8px;
  font-size: 28px;
  color: #a5b4fc;
}

header p {
  color: #cbd5e1;
  margin: 0;
}

.card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 18px;
  padding: 18px;
  margin: 16px 0;
}

h2 {
  font-size: 19px;
  margin-top: 0;
  color: #c4b5fd;
}

button,
.upload-label {
  display: inline-block;
  border: 0;
  border-radius: 10px;
  padding: 11px 15px;
  margin: 5px 3px;
  background: #6366f1;
  color: white;
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
  text-align: center;
}

button:active,
.upload-label:active {
  transform: scale(.98);
}

button.secondary {
  background: #334155;
}

button.success {
  background: #059669;
}

button.danger {
  background: #be123c;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #475569;
  background: #0f172a;
  color: white;
  font-family: inherit;
  font-size: 14px;
  margin: 6px 0 12px;
}

input[type="range"] {
  padding: 0;
  accent-color: #818cf8;
}

input[type="file"] {
  display: none;
}

label.field-label {
  display: block;
  color: #e2e8f0;
  margin-top: 10px;
}

.preview-area {
  min-height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0f172a;
  border: 2px dashed #475569;
  border-radius: 14px;
  padding: 10px;
  overflow: hidden;
}

#preview {
  display: none;
  max-width: 100%;
  max-height: 480px;
  object-fit: contain;
  border-radius: 8px;
}

#emptyMessage {
  color: #94a3b8;
  text-align: center;
  padding: 20px;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 12px;
}

.button-row button {
  flex: 1 1 120px;
}

.control {
  margin: 12px 0;
}

.control-header {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.value {
  color: #a5b4fc;
  direction: ltr;
}

.note {
  background: #172554;
  color: #dbeafe;
  padding: 12px;
  border-radius: 10px;
  font-size: 13px;
  margin-top: 12px;
}

#status {
  min-height: 28px;
  color: #86efac;
  font-size: 14px;
}

footer {
  text-align: center;
  padding: 20px 8px;
  color: #94a3b8;
  font-size: 12px;
}

@media (max-width: 480px) {
  body {
    padding: 10px;
  }

  .card {
    padding: 13px;
  }

  header h1 {
    font-size: 23px;
  }

  button,
  .upload-label {
    padding: 10px 12px;
  }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>🎨 استودیوی تصویر کسری AI</h1>
  <p>تصویرت را انتخاب کن، ویرایش کن و ذخیره کن.</p>
</header>

<section class="card">
  <h2>۱. انتخاب تصویر</h2>

  <label class="upload-label" for="imageInput">
    📁 انتخاب تصویر از گالری
  </label>

  <input
    type="file"
    id="imageInput"
    accept="image/*"
  >

  <div class="preview-area">
    <p id="emptyMessage">
      هنوز تصویری انتخاب نکرده‌ای.
      <br>
      برای شروع، روی «انتخاب تصویر از گالری» بزن.
    </p>

    <img id="preview" alt="پیش‌نمایش تصویر">
  </div>

  <div class="button-row">
    <button id="downloadButton" class="success">
      ⬇️ دانلود تصویر
    </button>

    <button id="resetButton" class="secondary">
      ↩️ بازنشانی
    </button>
  </div>

  <p id="status" role="status"></p>
</section>

<section class="card">
  <h2>۲. تنظیمات تصویر</h2>

  <div class="control">
    <div class="control-header">
      <label for="brightness">روشنایی</label>
      <span class="value" id="brightnessValue">100%</span>
    </div>
    <input
      type="range"
      id="brightness"
      min="0"
      max="200"
      value="100"
    >
  </div>

  <div class="control">
    <div class="control-header">
      <label for="contrast">کنتراست</label>
      <span class="value" id="contrastValue">100%</span>
    </div>
    <input
      type="range"
      id="contrast"
      min="0"
      max="200"
      value="100"
    >
  </div>

  <div class="control">
    <div class="control-header">
      <label for="saturation">اشباع رنگ</label>
      <span class="value" id="saturationValue">100%</span>
    </div>
    <input
      type="range"
      id="saturation"
      min="0"
      max="200"
      value="100"
    >
  </div>

  <div class="control">
    <div class="control-header">
      <label for="blur">تاری تصویر</label>
      <span class="value" id="blurValue">0px</span>
    </div>
    <input
      type="range"
      id="blur"
      min="0"
      max="10"
      value="0"
    >
  </div>

  <div class="button-row">
    <button id="rotateLeft" class="secondary">
      ↶ چرخش چپ
    </button>

    <button id="rotateRight" class="secondary">
      ↷ چرخش راست
    </button>

    <button id="flipButton" class="secondary">
      ↔️ برعکس کردن
    </button>
  </div>
    </section>
